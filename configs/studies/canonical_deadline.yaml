# Current thesis architecture. Every remaining mechanism study extends this.
# Do not submit capacity_rematch / decoded_equivalence / entanglement_ablation /
# dose_response / data_efficiency / qubit_ablation_4q / entanglement_ablation_d8.
#
# Same AE + GAN + data as paper_style_cpu_deadline:
#   d=64, 8 qubits hybrid, recording-norm, E1 predefined, AE 80/20, 80k, 1000 steps
# Clinical clips / stft_bilstm stay on paper_style_* only.

n_seeds: 2
n_folds: 2

latent_dim: 64
n_qubits: 8
latent_transform: identity
noise_dim: latent

data:
  split_mode: predefined
  normalize_scope: recording
  require_patient_groups: false
  max_segments_per_batch: 400

autoencoder:
  bottleneck: temporal
  arch: v2
  widths: [128, 256, 256]
  epochs: 80
  patience: 20
  max_train_windows: 80000
  max_nmse: 0.55
  on_gate_failure: raise
  lr_schedule: cosine
  stft_weight: 0.1

training:
  equal_budget: true
  generator_steps: 1000
  eval_every: 250
  match_lr: true
  generator_lr: 0.001

n_synthetic: 16384
noise_floor_repeats: 50

clinical:
  enabled: false

skip_downstream: true

save:
  artifacts: true
  autoencoder: true
  generators: true
  critics: false
  latents: true
  latent_transform: true
  decoded: false
  detectors: false
