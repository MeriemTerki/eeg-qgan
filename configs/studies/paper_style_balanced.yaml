# Paper-style protocol (Abou-Abbas et al. 2024 logic) with latent quantum generation.
#
# What this matches from the Frontiers paper / what your supervisor endorsed:
#   1. Generator learns from the TRAIN fold only (latent Style-qGAN / classical twin / GMM).
#   2. Detector trains on REAL + SYNTHETIC seizures, aimed at class balance.
#   3. Detector is evaluated on REAL holdout only (dev/eval) — never on synthetic.
#   4. Outer split stays patient-disjoint (TUH train vs holdout folders).
#
# What this deliberately does NOT copy from that paper:
#   - Do NOT fit the GAN on the full corpus and then split. Synthetic is always
#     produced inside the outer train fold. That is the honest version of the same
#     "train mixed, test real" idea.
#
# Flow per fold:
#   AE + latent quantum generator (real train seizures)
#     -> decode synthetic short windows
#     -> pack to ~10.24 s clips with seam crossfade
#     -> train stft_bilstm on real clips + enough synthetic positives to balance
#     -> score on real test clips only
#   Also trains a real-only baseline so ΔAUROC / ΔAUPRC / ΔMCC isolate the synthetic effect.
#
# Submit (CPU is fine):
#   python scripts/narval/submit.py paper_style_balanced --split-by seed-fold --no-gpu \
#     --set output_root=$SCRATCH/eeg_qgan_results_paper_style

extends: capacity_rematch

n_seeds: 2
n_folds: 2

generator_arms:
  - quantum
  - classical_equiv
  - gmm

data:
  normalize_scope: recording
  max_segments_per_batch: 800

clinical:
  enabled: true
  detector_only: false
  clip_windows: 8
  clip_stride: 4
  label_mode: any
  require_contiguous: true
  n_fft: 128
  hop_length: 64
  synthetic_crossfade: 32

# Enough short windows to deliver a balanced *clip* dose after packing (×8).
# max_add below is in CLIP units for dose_mode: balance under clinical packing.
n_synthetic: 32768

augmentation:
  dose_mode: balance
  target_ratio: 1.0          # aim for #positives ≈ #negatives in detector train
  max_add: 2048              # cap synthetic clips (→ up to 16384 short windows)
  max_shortfall_fraction: 0.05
  quality_gate: false

detector:
  kind: stft_bilstm
  conv_channels: [32, 64, 128]
  proj_dim: 256
  lstm_hidden: 128
  lstm_layers: 2
  head_hidden: 256
  n_fft: 128
  hop_length: 64
  dropout: 0.3
  use_spectral: true
  epochs: 80
  patience: 15
  batch_size: 32
  lr: 0.0003
  early_stop_metric: auprc
  threshold_metric: mcc
  balanced_batches: true
  oversample_positives: false
  window_augment: true
  augment_time_shift: 64
  augment_scale: 0.0
  augment_channel_dropout: 0.05
  augment_noise_std: 0.01

skip_downstream: false
