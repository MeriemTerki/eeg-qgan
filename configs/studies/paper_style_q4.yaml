# Same pipeline as paper_style_cpu_deadline. Only the circuit width changes: 4 qubits
# instead of 8. Latent dim stays 64 (the AE you actually selected). The generator is
# still hybrid: 4-qubit PQC + Linear(4 -> 64). That is the fair "only qubits change"
# comparison. Do not set latent_dim: 4 here — that is a different AE and is not comparable.
#
# Submit after cancelling qubit_ablation_4q (those jobs are dim-4):
#   python scripts/narval/submit.py paper_style_q4 --split-by seed-fold --no-gpu \
#     --set output_root=$SCRATCH/eeg_qgan_results_paper_style_q4

extends: paper_style_cpu_deadline

latent_dim: 64
n_qubits: 4
latent_transform: identity
noise_dim: latent
