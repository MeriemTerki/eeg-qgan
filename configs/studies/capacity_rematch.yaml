# The headline comparison: circuit vs capacity-matched twin, equal budget.
#
# Narval probes: d=32 → NMSE ~0.61; d=64 + lean AE → NMSE ~0.544 (plateau).
# Gate is calibrated to max_nmse 0.55 (still far below the mean-predictor failure
# at NMSE ≥ 1). Full-fold AE training, widths [128,256,256].

n_seeds: 3
# Predefined protocol yields one fold per holdout (dev, eval) → 2 folds.
n_folds: 2

latent_dim: 64
n_qubits: 8

latent_transform: identity

generator_arms:
  - quantum
  - classical_equiv
  - classical_matched
  - classical_large
  - gmm

quantum:
  n_layers: 4
  entanglement: ring

training:
  equal_budget: true
  generator_steps: 1500
  batch_size: 128
  match_lr: true
  generator_lr: 0.001

autoencoder:
  arch: v2
  widths: [128, 256, 256]
  epochs: 600
  patience: 60
  lr_schedule: cosine
  stft_weight: 0.1
  max_train_windows: null
  on_gate_failure: raise
  max_nmse: 0.55

n_synthetic: 8192

augmentation:
  dose_mode: fixed
  dose_count: 8192
  max_add: 12000
  max_shortfall_fraction: 0.05

detector:
  kind: cnn_bilstm_v2
  conv_widths: [96, 192, 384]
  blocks_per_stage: 2
  lstm_hidden: 192
  lstm_layers: 2
  head_hidden: 256
  epochs: 100
  patience: 20
  lr: 0.0003
  early_stop_metric: auprc
  threshold_metric: mcc
  balanced_batches: true
  oversample_positives: false
  use_spectral: true
  window_augment: true
